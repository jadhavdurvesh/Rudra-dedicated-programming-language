[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rudrac"
version = "0.14.0"
description = "Compiler for the Rudra slave-node language (.rudra to Arduino C++)"
requires-python = ">=3.9"

[project.scripts]
rudrac = "rudrac.cli:main"

[tool.setuptools]
packages = ["rudrac", "rudrac.avr"]
